name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.5

jobs:
  static-frontend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: git diff --exit-code
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/magazzino-solidale test
      - run: pnpm --filter @workspace/magazzino-solidale build
        env:
          PORT: 19176
          BASE_PATH: /
      - run: pnpm --filter @workspace/magazzino-solidale build:budget
      - run: docker build -f Dockerfile.api -t magazzino-solidale-api:ci .
      - run: docker build -f Dockerfile.web -t magazzino-solidale-web:ci .
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: git diff --exit-code
      - run: git diff --check

  api-and-fresh-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/quality-gates-plan.test.mjs scripts/m63-test-guards.test.mjs
      - run: node scripts/quality-gates-run.mjs api
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-quality-gates
          path: |
            test-results/quality-gates/api/**/*.log
            test-results/quality-gates/api/**/*.json
          retention-days: 7

  browser-critical-paths:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/magazzino-solidale exec playwright install --with-deps chromium
      # Historical document tests require this private temporary output prefix.
      # It exists on macOS; prepare the equivalent ephemeral path on this runner.
      - run: sudo install -d -m 0700 -o "$(id -un)" /private/tmp
      - run: node scripts/quality-gates-run.mjs browser --partition=${{ matrix.partition }}/4
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-gates-${{ matrix.partition }}
          # Do not publish browser traces, screenshots, synthetic uploads or
          # credentials captured while filling the temporary login forms.
          path: |
            test-results/quality-gates/browser/*/*.log
            test-results/quality-gates/browser/*/*.json
          retention-days: 7
