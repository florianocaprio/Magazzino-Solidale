            schema: { $ref: "#/components/schemas/BeneficiarioFseUpdate" }
      responses:
        "200":
          description: Fascicolo aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiarioFseProfile" }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }
        "404": { $ref: "#/components/responses/BeneficiariFseNotFound" }
        "409": { $ref: "#/components/responses/BeneficiariFseConflict" }

  /beneficiari/{id}:
    get:
      operationId: getBeneficiario
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beneficiary with family and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiarioDettaglio"
    patch:
      operationId: updateBeneficiario
