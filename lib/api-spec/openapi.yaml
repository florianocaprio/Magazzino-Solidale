      parameters:
        - name: da
          in: query
          schema:
            type: string
        - name: a
          in: query
          schema:
            type: string
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Turno"
    put:
      operationId: upsertTurno
      tags: [turni]
      summary: Create or replace a shift (centro+data+fascia) and its volunteers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoInput"
      responses:
        "200":
          description: Upserted shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"
        "204":
          description: Empty non-existing slot; no record created
        "400":
          description: Invalid payload or missing version on update
        "403":
          description: Resource outside the caller scope or not assignable
        "409":
          description: Stale version or concurrent slot conflict

  /turni/volontari-pending:
    post:
      operationId: createTurnoVolontarioPending
