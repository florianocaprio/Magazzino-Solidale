  /mensa/mense:
    get:
      operationId: listMense
      tags: [mensa]
      parameters:
        - name: areaOperativaId
          in: query
          description: Identificativo dell'Area Operativa usata come confine organizzativo dei dati.
          schema: { type: integer }
        - { name: attiva, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Mense visibili nello scope territoriale
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Mensa" } }
    post:
      operationId: createMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaInput" }
      responses:
        "201":
          description: Mensa creata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
        "400":
          description: Area, Centro di Ascolto o dati della sede non validi
        "409":
          description: Codice già utilizzato o entità associata non attiva

  /mensa/mense/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getMensa
      tags: [mensa]
      responses:
        "200":
          description: Dettaglio Mensa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
    patch:
      operationId: updateMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaUpdate" }
      responses:
        "200":
          description: Mensa aggiornata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
        "409": { description: Versione superata }

