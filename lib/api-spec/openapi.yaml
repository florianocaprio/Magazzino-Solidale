        lottoId: { type: integer, minimum: 1 }
        quantita:
          {
            oneOf:
              [
                { type: number, exclusiveMinimum: 0 },
                { type: string, pattern: "^[0-9]+([.][0-9]{1,6})?$" },
              ],
          }
    FseOpcReturnInput:
