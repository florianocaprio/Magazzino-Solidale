                items: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/giornate/{id}/chiudi:
    post:
      operationId: chiudiGiornataMensa
      tags: [mensa]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaChiusuraInput" }
      responses:
        "200":
          description: Giornata chiusa con snapshot riepilogativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/giornate/{id}/riapri:
    post:
      operationId: riapriGiornataMensa
      tags: [mensa]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaRiaperturaInput" }
      responses:
        "200":
          description: Giornata riaperta con audit obbligatorio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/report:
    get:
      operationId: getMensaReport
      tags: [mensa]
      parameters:
        - {
            name: dal,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - {
            name: al,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - { name: mensaId, in: query, schema: { type: integer } }
        - { name: tipoServizio, in: query, schema: { type: string } }
      responses:
        "200":
          description: Indicatori aggregati del periodo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaReport" }

  /aree:
    get:
      operationId: listAree
      tags: [aree]
      responses:
        "200":
          description: List of access areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"

  /permessi:
    get:
      operationId: listPermessi
      tags: [aree]
      summary: Elenco centralizzato dei permessi assegnabili ai ruoli
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /ruoli:
    get:
      operationId: listRuoli
      tags: [ruoli]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ruolo"
    post:
      operationId: createRuolo
      tags: [ruoli]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuoloInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"

  /ruoli/{id}:
    get:
      operationId: getRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"
    patch:
      operationId: updateRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuoloUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"
    delete:
      operationId: deleteRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Role still assigned to users

  /utenti:
    get:
      operationId: listUtenti
      tags: [utenti]
      parameters:
        - name: areaOperativaId
          in: query
          required: false
          schema:
            type: integer
        - name: matricola
          in: query
          required: false
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
    post:
      operationId: createUtente
      tags: [utenti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
        "409":
          description: Username already exists

  /utenti/{id}:
    get:
      operationId: getUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    patch:
      operationId: updateUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    delete:
      operationId: deleteUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /utenti/{id}/reset-password:
    post:
      operationId: resetUtentePassword
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Password reset link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResponse"
        "400":
          description: User has no valid email address
        "403":
          description: Not authorized

# ─── SCHEMAS ──────────────────────────────────────────────────────────────────
components:
  parameters:
    FseMagazzinoId:
      name: magazzinoId
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    FseOptionalMagazzinoId:
      name: magazzinoId
      in: query
      schema: { type: integer, minimum: 1 }
    FseOptionalDataDa:
      name: dataCompetenzaDa
      in: query
      schema: { type: string, format: date }
    FseOptionalDataA:
      name: dataCompetenzaA
      in: query
      schema: { type: string, format: date }
    FseOptionalStato:
      name: stato
      in: query
      schema: { type: string, maxLength: 60 }
    FseDataDa:
      name: dataCompetenzaDa
      in: query
      required: true
      schema: { type: string, format: date }
    FseDataA:
      name: dataCompetenzaA
      in: query
      required: true
      schema: { type: string, format: date }
    FseDataAsOf:
      name: dataAsOf
      in: query
      schema: { type: string, format: date }
    FseIncludeArretrati:
      name: includeArretrati
      in: query
      schema: { type: boolean, default: true }
    FsePage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    FsePageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    FseQueueStato:
      name: statoRendicontazione
      in: query
      schema:
        type: string
        enum: [DA_RENDICONTARE, ARRETRATO_NON_RENDICONTATO, BLOCCATO]
    FseQueueCanale:
      name: canale
      in: query
      schema: { type: string }
    FseQueueFondo:
      name: fondo
      in: query
      schema: { type: string }
    FseQueueProdottoId:
      name: prodottoId
      in: query
      schema: { type: integer, minimum: 1 }
    FseQueueQualityCode:
      name: qualityCode
      in: query
      schema: { type: string }
    FseDownloadRepresentation:
      name: representation
      in: query
      description: Rappresentazione derivata dallo stesso snapshot immutabile
      schema:
        type: string
        enum:
          [FSE_CANONICAL_AUDIT_XLSX_V1, SIFEAD_REGISTRO_OSSERVATO_CONTROLLO_V1]
    PageParam:
      name: page
      in: query
      description: Pagina richiesta, indicizzata da 1
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      description: Numero di record per pagina
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ReportDa:
      name: da
      in: query
      description: Data civile iniziale Europe/Rome (YYYY-MM-DD)
      schema: { type: string, format: date }
    ReportA:
      name: a
      in: query
      description: Data civile finale Europe/Rome (YYYY-MM-DD)
      schema: { type: string, format: date }
    ReportAnno:
      name: anno
      in: query
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    ReportAreaOperativaId:
      name: areaOperativaId
      in: query
      description: Ignorabile solo per utenti globali; gli utenti scoped restano vincolati alla propria area operativa
      schema: { type: integer }
    ReportCentroId:
      name: centroAscoltoId
      in: query
      description: Gli utenti con Centro assegnato restano vincolati al proprio perimetro
      schema: { type: integer }
    ReportMagazzinoId:
      name: magazzinoId
      in: query
      schema: { type: integer }
    ReportMensaId:
      name: mensaId
      in: query
      schema: { type: integer }
    ReportZonaUdsId:
      name: zonaUdsId
      in: query
      schema: { type: integer }
    ReportOperatoreId:
      name: operatoreId
      in: query
      schema: { type: integer }
    ReportTipoIntervento:
      name: tipoIntervento
      in: query
      schema: { type: string }
    ReportTipoServizio:
      name: tipoServizio
      in: query
      schema: { type: string }
    MapsDa:
      name: da
      in: query
      description: Data civile iniziale Europe/Rome; default oggi
      schema: { type: string, format: date }
    MapsA:
      name: a
      in: query
      description: Data civile finale Europe/Rome; default da + 7 giorni, massimo 31 giorni
      schema: { type: string, format: date }
  responses:
    FseBadRequest:
      description: Richiesta FSE+ non valida
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/FseErrorResponse" } },
        }
    FseForbidden:
      description: Permesso o scope FSE+ non consentito
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/FseErrorResponse" } },
        }
    FseNotFound:
      description: Risorsa FSE+ non trovata
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/FseErrorResponse" } },
        }
    FseConflict:
      description: Versione, cutoff, copertura o concorrenza non validi
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/FseErrorResponse" } },
        }
    FsePayloadTooLarge:
      description: Payload FSE+ oltre il limite operativo
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/FseErrorResponse" } },
        }
    AgeaBadRequest:
      description: Richiesta AGEA non valida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    AgeaForbidden:
      description: Permesso o scope AGEA non consentito
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    AgeaNotFound:
      description: Risorsa AGEA non trovata
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    AgeaConflict:
      description: Versione, preflight o concorrenza AGEA non validi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    AgeaPayloadTooLarge:
      description: Limite di 10 MB superato
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    AgeaUnsupportedMediaType:
      description: MIME XLSX richiesto
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgeaErrorResponse" }
    BeneficiariFseBadRequest:
      description: Contratto, file, data o identificativo non valido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
    BeneficiariFseUnauthorized:
      description: Sessione non autenticata
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
    BeneficiariFseForbidden:
      description: Permesso FSE+ o scope territoriale non consentito
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
    BeneficiariFseNotFound:
      description: Beneficiario o fascicolo non trovato
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
    BeneficiariFseConflict:
      description: Codice fascicolo già associato o conflitto di riconciliazione
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
    BeneficiariFseUnprocessable:
      description: Preflight export non superato
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeneficiariFseError" }
  schemas:
    BeneficiariFseRowInput:
      type: object
      additionalProperties: true
      properties:
        "Nome Referente fascicolo": { type: string }
        "Cognome Referente fascicolo": { type: string }
        "Codice fascicolo": { type: string }
        "Data di presa in carico": { anyOf: [{ type: string }, { type: number }] }
        "Numero componenti fascicolo": { anyOf: [{ type: string }, { type: number }] }
        "Tipologia di Attività": { type: string }
        "Stato attuale": { type: string }
        "Donne": { anyOf: [{ type: string }, { type: number }] }
        "Uomini": { anyOf: [{ type: string }, { type: number }] }
        "Età<18": { anyOf: [{ type: string }, { type: number }] }
        "Età 18-29": { anyOf: [{ type: string }, { type: number }] }
        "Età 30-64": { anyOf: [{ type: string }, { type: number }] }
        "Età>=65": { anyOf: [{ type: string }, { type: number }] }
        "Origine straniera e minoranze": { anyOf: [{ type: string }, { type: number }] }
        "Disabili": { anyOf: [{ type: string }, { type: number }] }
        "Cittadini di Paesi Terzi": { anyOf: [{ type: string }, { type: number }] }
        "Senzatetto o colpiti da esclusione abitativa": { anyOf: [{ type: string }, { type: number }] }
      required:
        [
          "Nome Referente fascicolo",
          "Cognome Referente fascicolo",
          "Codice fascicolo",
          "Data di presa in carico",
          "Numero componenti fascicolo",
          "Tipologia di Attività",
          "Stato attuale",
          "Donne",
          "Uomini",
          "Età<18",
          "Età 18-29",
          "Età 30-64",
          "Età>=65",
          "Origine straniera e minoranze",
          "Disabili",
          "Cittadini di Paesi Terzi",
          "Senzatetto o colpiti da esclusione abitativa",
        ]
    BeneficiariFseWorkbookUpload:
      type: object
      additionalProperties: false
      properties:
        centroAscoltoId: { type: integer, minimum: 1 }
        dataRiferimento:
          type: string
          format: date
          description: Data civile Europe/Rome da cui i dati importati sono storicamente validi.
        file:
          type: string
          format: binary
          description: Workbook XLSX reale; non viene conservato dal server.
      required: [centroAscoltoId, dataRiferimento, file]
    BeneficiariFseImportResolution:
      type: object
      additionalProperties: false
      properties:
        numeroRiga: { type: integer, minimum: 2 }
        azione: { type: string, enum: [crea, collega] }
        beneficiarioId: { type: integer, minimum: 1 }
      required: [numeroRiga, azione]
    BeneficiariFseWorkbookImportUpload:
      type: object
      additionalProperties: false
      properties:
        centroAscoltoId: { type: integer, minimum: 1 }
        dataRiferimento:
          type: string
          format: date
          description: Data confermata nella preview e rivalidata dal server.
        file:
          type: string
          format: binary
          description: Lo stesso workbook XLSX reale viene rivalidato dal server.
        risoluzioni:
          type: string
          description: Array JSON di BeneficiariFseImportResolution.
      required: [centroAscoltoId, dataRiferimento, file]
    BeneficiariFseDuplicateCandidate:
      type: object
      properties:
        id: { type: integer }
        codice: { type: string }
        centroAscoltoId: { type: [integer, "null"] }
      required: [id, codice, centroAscoltoId]
    BeneficiariFsePreviewRow:
      type: object
      properties:
        numeroRiga: { type: integer }
        codiceFascicolo: { type: [string, "null"] }
        classificazione:
          type: string
          enum: [nuovo, da_collegare, da_aggiornare, invariato, possibile_duplicato, conflitto, errore]
        errori: { type: array, items: { type: string } }
        warning: { type: array, items: { type: string } }
        beneficiarioId: { type: integer }
        duplicati:
          type: array
          items: { $ref: "#/components/schemas/BeneficiariFseDuplicateCandidate" }
      required: [numeroRiga, codiceFascicolo, classificazione, errori, warning]
    BeneficiariFsePreviewResult:
      type: object
      properties:
        centroAscoltoId: { type: integer }
        areaOperativaId: { type: integer }
        areaOperativaDerivata: { type: boolean, const: true }
        warningHeader: { type: array, items: { type: string } }
        righe:
          {
            type: array,
            items: { $ref: "#/components/schemas/BeneficiariFsePreviewRow" },
          }
        conteggi: { type: object, additionalProperties: { type: integer } }
        numeroRighe: { type: integer }
        dataRiferimento: { type: string, format: date }
      required:
        [
          centroAscoltoId,
          areaOperativaId,
          areaOperativaDerivata,
          warningHeader,
          righe,
          conteggi,
          numeroRighe,
          dataRiferimento,
        ]
    BeneficiariFseImportDetail:
      type: object
      properties:
        numeroRiga: { type: integer }
        codiceFascicolo: { type: [string, "null"] }
        esito:
          {
            type: string,
            enum: [creato, collegato, aggiornato, invariato, conflitto, errore],
          }
        errori: { type: array, items: { type: string } }
      required: [numeroRiga, codiceFascicolo, esito, errori]
    BeneficiariFseImportResult:
      type: object
      properties:
        batchId: { type: integer }
        stato: { type: string, enum: [confermato, parziale] }
        dataRiferimento: { type: string, format: date }
        creati: { type: integer }
        collegati: { type: integer }
        aggiornati: { type: integer }
        invariati: { type: integer }
        conflitti: { type: integer }
        errori: { type: integer }
        dettagli:
          {
            type: array,
            items: { $ref: "#/components/schemas/BeneficiariFseImportDetail" },
          }
      required:
        [
          batchId,
          stato,
          dataRiferimento,
          creati,
          collegati,
          aggiornati,
          invariati,
          conflitti,
          errori,
          dettagli,
        ]
    BeneficiariFseExportInput:
      type: object
      additionalProperties: false
      properties:
        centroAscoltoId: { type: integer, minimum: 1 }
        dataRiferimento: { type: string, format: date }
        soloAttivi: { type: boolean, default: true }
      required: [centroAscoltoId, dataRiferimento]
    BeneficiariFseExportIssue:
      type: object
      properties:
        beneficiarioId: { type: integer }
        codice: { type: string }
        errori: { type: array, items: { type: string } }
        warning: { type: array, items: { type: string } }
      required: [beneficiarioId, codice]
    BeneficiariFseExportPreflight:
      type: object
      properties:
        candidati: { type: integer }
        esportabili: { type: integer }
        bloccati: { type: array, items: { $ref: "#/components/schemas/BeneficiariFseExportIssue" } }
        warning: { type: array, items: { $ref: "#/components/schemas/BeneficiariFseExportIssue" } }
        centroAscoltoId: { type: integer }
        areaOperativaId: { type: integer }
        dataRiferimento: { type: string, format: date }
        soloAttivi: { type: boolean, const: true }
      required: [candidati, esportabili, bloccati, warning, centroAscoltoId, areaOperativaId, dataRiferimento, soloAttivi]
    BeneficiarioFseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        codiceFascicolo: { type: string, minLength: 1, maxLength: 255 }
        origineStranieraMinoranze: { type: [integer, "null"], minimum: 0 }
        cittadiniPaesiTerzi: { type: [integer, "null"], minimum: 0 }
        senzaTettoEsclusioneAbitativa: { type: [integer, "null"], minimum: 0 }
        dataRiferimento:
          type: string
          format: date
          description: Data civile Europe/Rome di validità storica della correzione.
        versione:
          type: integer
          minimum: 0
          description: Versione letta dal chiamante per optimistic locking; 0 se il profilo non esiste ancora.
      required: [dataRiferimento, versione]
    BeneficiarioFseSnapshot:
      type: object
      properties:
        numeroComponenti: { type: integer }
        donne: { type: integer }
        uomini: { type: integer }
        eta017: { type: integer }
        eta1829: { type: integer }
        eta3064: { type: integer }
        eta65Plus: { type: integer }
      required: [numeroComponenti, donne, uomini, eta017, eta1829, eta3064, eta65Plus]
    BeneficiarioFseDemografia:
      allOf:
        - $ref: "#/components/schemas/BeneficiarioFseSnapshot"
        - type: object
          properties:
            origine: { type: string, enum: [anagrafica_calcolata, snapshot_fse] }
            dettaglioCompleto: { type: boolean }
            problemi: { type: array, items: { type: string } }
          required: [origine, dettaglioCompleto, problemi]
    BeneficiarioFseDifference:
      type: object
      properties:
        dato: { type: string }
        snapshot: { type: integer }
        calcolato: { type: integer }
      required: [dato, snapshot, calcolato]
    BeneficiarioFseComparison:
      type: object
      properties:
        stato: { type: string, enum: [coerente, non_allineato, non_confrontabile] }
        differenze: { type: array, items: { $ref: "#/components/schemas/BeneficiarioFseDifference" } }
      required: [stato, differenze]
    BeneficiarioFseProfile:
      type: object
      properties:
        id: { type: integer }
        beneficiarioId: { type: integer }
        codiceFascicolo: { type: [string, "null"] }
        codiceFascicoloNormalizzato: { type: [string, "null"] }
        origineFascicolo: { type: string, enum: [interno, import_fse] }
        numeroComponentiImportato: { type: [integer, "null"] }
        donneImportate: { type: [integer, "null"] }
        uominiImportati: { type: [integer, "null"] }
        eta017Importata: { type: [integer, "null"] }
