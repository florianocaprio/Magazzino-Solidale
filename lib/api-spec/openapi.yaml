      description: Richiede mensa.transfers.request (oppure il permesso legacy mensa.transfers.manage). La spedizione resta riservata a magazzino.transfers.dispatch; la ricezione richiede mensa.transfers.receive.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        "200":
          description: Trasferimenti associati alle Mense
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object, additionalProperties: true }
                  - $ref: "#/components/schemas/MensaTrasferimentiPage"
    post:
      operationId: createTrasferimentoMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaTrasferimentoInput" }
      responses:
        "200":
          description: Replay idempotente
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "201":
          description: Trasferimento richiesto; avvio, conferma e PDF usano il motore logistico esistente
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /mensa/consumi:
    get:
      operationId: listConsumiMensa
      tags: [mensa]
      parameters:
        - { name: mensaId, in: query, schema: { type: integer } }
        - { name: data, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        "200":
          description: Consumi e scarti dichiarati, inclusi gli eventuali storni
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/MensaConsumo" }
                  - $ref: "#/components/schemas/MensaConsumiPage"
    post:
      operationId: createConsumoMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaConsumoInput" }
      responses:
        "200":
          description: Replay idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaConsumo" }
        "201":
          description: Consumo o scarto registrato sul ledger di Magazzino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaConsumo" }
        "409": { description: Giacenza insufficiente o giornata chiusa }

  /mensa/consumi/{id}/storno:
    post:
      operationId: stornaConsumoMensa
      tags: [mensa]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaStornoInput" }
      responses:
        "200": { description: Storno compensativo registrato }
        "409": { description: Consumo già stornato o giornata chiusa }

  /mensa/giornate:
    get:
      operationId: listGiornateMensa
      tags: [mensa]
      parameters:
        - { name: mensaId, in: query, schema: { type: integer } }
        - { name: data, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Giornate di servizio visibili
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/giornate/{id}/chiudi:
    post:
      operationId: chiudiGiornataMensa
      tags: [mensa]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaChiusuraInput" }
      responses:
        "200":
          description: Giornata chiusa con snapshot riepilogativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/giornate/{id}/riapri:
    post:
      operationId: riapriGiornataMensa
      tags: [mensa]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaRiaperturaInput" }
      responses:
        "200":
          description: Giornata riaperta con audit obbligatorio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaGiornata" }

  /mensa/report:
    get:
      operationId: getMensaReport
      tags: [mensa]
      parameters:
        - {
            name: dal,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - {
            name: al,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - { name: mensaId, in: query, schema: { type: integer } }
        - { name: tipoServizio, in: query, schema: { type: string } }
      responses:
        "200":
          description: Indicatori aggregati del periodo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensaReport" }

  /aree:
    get:
      operationId: listAree
      tags: [aree]
      responses:
        "200":
          description: List of access areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"

  /permessi:
    get:
      operationId: listPermessi
      tags: [aree]
      summary: Elenco centralizzato dei permessi assegnabili ai ruoli
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /ruoli:
    get:
      operationId: listRuoli
      tags: [ruoli]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ruolo"
    post:
      operationId: createRuolo
      tags: [ruoli]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuoloInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"

  /ruoli/{id}:
    get:
      operationId: getRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"
    patch:
      operationId: updateRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuoloUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruolo"
    delete:
      operationId: deleteRuolo
      tags: [ruoli]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Role still assigned to users

  /utenti:
    get:
      operationId: listUtenti
      tags: [utenti]
      parameters:
        - name: areaOperativaId
          in: query
          required: false
          schema:
            type: integer
        - name: matricola
          in: query
          required: false
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
    post:
      operationId: createUtente
      tags: [utenti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
        "409":
          description: Username already exists

  /utenti/{id}:
    get:
      operationId: getUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    patch:
      operationId: updateUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    delete:
      operationId: deleteUtente
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /utenti/{id}/reset-password:
    post:
      operationId: resetUtentePassword
      tags: [utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Password reset link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResponse"
        "400":
          description: User has no valid email address
        "403":
          description: Not authorized

# ─── SCHEMAS ──────────────────────────────────────────────────────────────────
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Pagina richiesta, indicizzata da 1
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      description: Numero di record per pagina
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ReportDa:
      name: da
      in: query
      description: Data civile iniziale Europe/Rome (YYYY-MM-DD)
      schema: { type: string, format: date }
    ReportA:
      name: a
      in: query
      description: Data civile finale Europe/Rome (YYYY-MM-DD)
      schema: { type: string, format: date }
    ReportAnno:
      name: anno
      in: query
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    ReportAreaOperativaId:
      name: areaOperativaId
      in: query
      description: Ignorabile solo per utenti globali; gli utenti scoped restano vincolati alla propria area operativa
      schema: { type: integer }
    ReportCentroId:
      name: centroAscoltoId
      in: query
      description: Gli utenti con Centro assegnato restano vincolati al proprio perimetro
      schema: { type: integer }
    ReportMagazzinoId:
      name: magazzinoId
      in: query
      schema: { type: integer }
    ReportMensaId:
      name: mensaId
      in: query
      schema: { type: integer }
    ReportZonaUdsId:
      name: zonaUdsId
      in: query
      schema: { type: integer }
    ReportOperatoreId:
      name: operatoreId
      in: query
      schema: { type: integer }
    ReportTipoIntervento:
      name: tipoIntervento
      in: query
      schema: { type: string }
    ReportTipoServizio:
      name: tipoServizio
      in: query
      schema: { type: string }
    MapsDa:
      name: da
      in: query
      description: Data civile iniziale Europe/Rome; default oggi
      schema: { type: string, format: date }
    MapsA:
      name: a
      in: query
      description: Data civile finale Europe/Rome; default da + 7 giorni, massimo 31 giorni
      schema: { type: string, format: date }
  schemas:
    MapsLayerCode:
      type: string
      enum:
        [
          sociale.interventi_pianificati,
          pacchi.consegne,
          pacchi.ritiri_non_effettuati,
          centro.punti_operativi,
        ]
    MapsLayerCapability:
      type: object
      required: [code, domain, label, routeSupported]
      properties:
        code: { $ref: "#/components/schemas/MapsLayerCode" }
        domain: { type: string, enum: [sociale, pacchi, centro] }
        label: { type: string }
        routeSupported: { type: boolean }
    MapsCapabilities:
      type: object
      required: [operational, layers]
      properties:
        operational: { type: boolean }
        layers:
          type: array
          items: { $ref: "#/components/schemas/MapsLayerCapability" }
    MapsMarker:
      type: object
      description: DTO geografico minimizzato; non contiene dati sociali o anagrafici
      required:
        [
          id,
          layer,
          entityType,
          entityId,
          title,
          subtitle,
          status,
          address,
          date,
          actions,
        ]
      properties:
        id: { type: string }
        layer: { $ref: "#/components/schemas/MapsLayerCode" }
        entityType:
          {
            type: string,
            enum: [intervento, consegna, bolla, magazzino, centro_ascolto],
          }
        entityId: { type: integer }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        status: { type: string }
        address: { type: string }
        date: { type: [string, "null"] }
        actions:
          type: array
          items: { type: string, enum: [open, route, convert_delivery] }
    MapsRoute:
      type: object
      required: [origin, destination, provider, url]
      properties:
        origin: { type: string }
        destination: { type: string }
        provider: { type: string, enum: [google-maps-url] }
        url: { type: string, format: uri }

    ReportingDashboard:
      type: object
      required:
        [
          section,
          filters,
          kpi,
          series,
          tables,
          quality,
          definitions,
          generatedAt,
          timezone,
        ]
      properties:
        section:
          type: string
          enum:
            [
              generale,
              pacchi,
              centro-ascolto,
              emporio,
              mensa,
              uds,
              magazzino-logistica,
              fse-plus,
            ]
        filters:
          $ref: "#/components/schemas/ReportAppliedFilters"
        kpi:
          type: array
          items: { $ref: "#/components/schemas/ReportKpi" }
        series:
          type: array
          items: { $ref: "#/components/schemas/ReportSeries" }
        tables:
          type: array
          items: { $ref: "#/components/schemas/ReportTable" }
        quality:
          type: array
          items: { $ref: "#/components/schemas/ReportQualityItem" }
        definitions:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, enum: [Europe/Rome] }

    ReportAppliedFilters:
      type: object
      required:
        [
          da,
          a,
          anno,
          areaOperativaId,
          centroAscoltoId,
          magazzinoId,
          mensaId,
          zonaUdsId,
          operatoreId,
          tipoIntervento,
          tipoServizio,
        ]
      properties:
        da: { type: string, format: date }
        a: { type: string, format: date }
        anno: { type: integer }
        areaOperativaId: { type: [integer, "null"] }
        centroAscoltoId: { type: [integer, "null"] }
        magazzinoId: { type: [integer, "null"] }
        mensaId: { type: [integer, "null"] }
        zonaUdsId: { type: [integer, "null"] }
        operatoreId: { type: [integer, "null"] }
        tipoIntervento: { type: [string, "null"] }
        tipoServizio: { type: [string, "null"] }

    ReportKpi:
      type: object
      required: [key, value, unit, availability, drilldownMetric]
      properties:
        key: { type: string }
        value: { type: [number, "null"] }
        unit:
          { type: string, enum: [count, quantity, kg, credit, days, average] }
        availability: { type: string, enum: [ok, derivable, missing] }
        drilldownMetric: { type: [string, "null"] }

    ReportSeries:
      type: object
      required: [key, points]
      properties:
        key: { type: string }
        points:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
              secondaryValue: { type: [number, "null"] }

    ReportTable:
      type: object
      required: [key, columns, rows]
      properties:
        key: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

    ReportQualityItem:
      type: object
      required: [key, count, availability, note]
      properties:
        key: { type: string }
        count: { type: [integer, "null"] }
        availability: { type: string, enum: [ok, derivable, missing] }
        note: { type: [string, "null"] }

    ReportDrilldown:
      type: object
      required: [section, metric, page, pageSize, total, columns, rows]
      properties:
        section: { type: string }
        metric: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

    ReportFilterOption:
      type: object
      required: [id, nome, areaOperativaId]
      properties:
        id: { type: integer }
        nome: { type: string }
        areaOperativaId: { type: [integer, "null"] }
        centroAscoltoId: { type: [integer, "null"] }

    ReportFilterOptions:
      type: object
      required: [section, areeOperative, centres, warehouses, mense, zones]
      properties:
        section:
          type: string
          enum:
            [
              generale,
              pacchi,
              centro-ascolto,
              emporio,
              mensa,
              uds,
              magazzino-logistica,
              fse-plus,
            ]
        areeOperative:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterOption" }
        centres:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterOption" }
        warehouses:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterOption" }
        mense:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterOption" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterOption" }

    ReportFsePlus:
      type: object
      properties:
        anno:
          type: integer
        pesoTotaleKg:
          type: number
        beneficiariTotali:
          type: integer
        personeTotali:
          type: integer
        prodotti:
          type: array
          items:
            type: object
            properties:
              prodottoId:
                type: integer
              prodottoNome:
                type: string
              unitaMisura:
                type: string
              quantitaTotale:
                type: number
              pesoKg:
                type: number
            required:
              [prodottoId, prodottoNome, unitaMisura, quantitaTotale, pesoKg]
        persone:
          type: object
          properties:
            maschi:
              type: integer
            femmine:
              type: integer
            ue:
              type: integer
            extraUe:
              type: integer
            maschiAdulti:
              type: integer
            maschiMinori:
              type: integer
            femmineAdulte:
              type: integer
            femmineMinori:
              type: integer
            ueMaschi:
              type: integer
            ueFemmine:
              type: integer
            extraUeMaschi:
              type: integer
            extraUeFemmine:
              type: integer
          required:
            [
              maschi,
              femmine,
              ue,
              extraUe,
              maschiAdulti,
              maschiMinori,
              femmineAdulte,
              femmineMinori,
              ueMaschi,
              ueFemmine,
              extraUeMaschi,
              extraUeFemmine,
            ]
      required:
        [
          anno,
          pesoTotaleKg,
          beneficiariTotali,
          personeTotali,
          prodotti,
          persone,
        ]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Dashboard ───────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        totMagazzini:
          type: integer
        totProdotti:
          type: integer
        totBeneficiari:
          type: integer
        totVolontari:
          type: integer
        consegneOggi:
          type: integer
        consegneMese:
          type: integer
        lottiInScadenza:
          type: integer
        prodottiSottoscorta:
          type: integer
        trasferimentiInCorso:
          type: integer
        interventiMese:
          type: integer
      required:
        [
          totMagazzini,
          totProdotti,
          totBeneficiari,
          totVolontari,
          consegneOggi,
          consegneMese,
          lottiInScadenza,
          prodottiSottoscorta,
          trasferimentiInCorso,
          interventiMese,
        ]

    Alert:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
        livello:
          type: string
        messaggio:
          type: string
        dettaglio:
          type: ["string", "null"]
        data:
          type: string
      required: [id, tipo, livello, messaggio, data]

    MovimentoSummary:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
        tipoDettaglio:
          type: string
        prodottoNome:
          type: string
        magazzinoNome:
          type: string
        quantita:
          type: number
        unitaMisura:
          type: string
        dataMovimento:
          type: string
      required:
        [
          id,
          tipo,
          tipoDettaglio,
          prodottoNome,
          magazzinoNome,
          quantita,
          unitaMisura,
          dataMovimento,
        ]

    # ── Magazzini ──────────────────────────────────────────────────────────
    Magazzino:
      type: object
      properties:
        id:
          type: integer
        codice:
          type: string
        nome:
          type: string
          minLength: 1
        indirizzo:
          type: ["string", "null"]
        comune:
          type: ["string", "null"]
        zona:
          type: ["string", "null"]
        responsabile:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        centroAscoltoId:
          type: ["integer", "null"]
        centroAscoltoNome:
          type: ["string", "null"]
        areaOperativaId:
          type: ["integer", "null"]
        tipoMagazzino:
          type: string
          enum: [logistico, emporio, misto, mensa]
        stato:
          type: string
        note:
          type: ["string", "null"]
        dataCreazione:
          type: string
      required: [id, codice, nome, tipoMagazzino, stato, dataCreazione]

    VolontariBulkInput:
      type: object
      required: [righe]
      properties:
        righe:
          type: array
          items:
            $ref: "#/components/schemas/VolontarioInput"

    MezziBulkInput:
      type: object
      required: [righe]
      properties:
        righe:
          type: array
          items:
            $ref: "#/components/schemas/MezzoInput"

    FornitoriBulkInput:
      type: object
      required: [righe]
      properties:
        righe:
          type: array
          items:
            $ref: "#/components/schemas/FornitoreInput"

    ProdottiBulkInput:
      type: object
