  # ─── INTERVENTI ──────────────────────────────────────────────────────────────
  /interventi:
    get:
      operationId: listInterventi
      tags: [interventi]
      parameters:
        - name: beneficiarioId
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            type: string
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: areaOperativaId
          in: query
          schema:
            type: integer
        - name: bisogni
          in: query
          description: Filtra gli interventi in base ai Bisogni Pianificati collegati.
          schema:
            type: string
            enum: [aperti, scaduti, nessuno]
        - name: stato
          in: query
          schema:
            $ref: "#/components/schemas/InterventoStato"
        - name: ambito
          in: query
          schema:
            $ref: "#/components/schemas/InterventoAmbito"
        - name: includiStorici
          in: query
          description: Se true e ambito è valorizzato, include anche gli interventi storici non classificati (ambito null). Il filtro di ambito resta esatto quando è omesso o false.
          schema:
            type: boolean
            default: false
        - name: operatoreId
          in: query
          schema:
            type: integer
        - name: priorita
          in: query
          schema:
            $ref: "#/components/schemas/InterventoPriorita"
        - name: pianificataDa
          in: query
          description: Estremo iniziale ISO 8601 con fuso dell'intervallo pianificato.
          schema:
            type: string
            format: date-time
        - name: pianificataA
          in: query
          description: Estremo finale ISO 8601 con fuso dell'intervallo pianificato.
          schema:
            type: string
            format: date-time
        - name: interventoPrecedenteId
          in: query
          schema:
            type: integer
        - name: vista
          in: query
          description: Vista operativa Sociale; richiede ambito=sociale. Oggi e i relativi confini civili sono calcolati in Europe/Rome.
          schema:
            $ref: "#/components/schemas/InterventoVista"
        - name: ricerca
          in: query
          description: Ricerca beneficiario per nome, cognome, nome completo o codice.
          schema:
            type: string
            maxLength: 120
        - name: da
          in: query
          description: Data civile iniziale inclusiva Europe/Rome; deve essere usata insieme ad a.
          schema:
            type: string
            format: date
        - name: a
          in: query
          description: Data civile finale inclusiva Europe/Rome; intervallo massimo 366 giorni.
          schema:
            type: string
            format: date
        - name: ordina
          in: query
          schema:
            type: string
            enum: [data, priorita, beneficiario, operatore]
        - name: direzione
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: ambitoLegacy
          in: query
          description: Selezione conservativa dei record Sociali classificati o con ambito storico non determinato.
          schema:
            type: string
            enum: [tutti, classificati, legacy]
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Per l'ambito Sociale restituisce una proiezione minimale senza note, descrizione, risultato o altri contenuti estesi; il dettaglio completo è disponibile su GET /interventi/{id}. L'ambito UDS conserva il DTO storico completo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intervento"
    post:
      operationId: createIntervento
      tags: [interventi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"

  /interventi/riepilogo-viste:
    get:
      operationId: getInterventiRiepilogoViste
      tags: [interventi]
      description: Restituisce in una singola query aggregata i contatori delle viste Sociali autorizzate, includendo conservativamente i record legacy.
      parameters:
        - name: beneficiarioId
          in: query
          schema: { type: integer }
        - name: ricerca
          in: query
          schema: { type: string, maxLength: 120 }
        - name: tipo
          in: query
          schema: { type: string }
        - name: priorita
          in: query
          schema: { $ref: "#/components/schemas/InterventoPriorita" }
        - name: operatoreId
          in: query
          schema: { type: integer }
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
        - name: stato
          in: query
          schema: { $ref: "#/components/schemas/InterventoStato" }
        - name: ambitoLegacy
          in: query
          schema:
            type: string
            enum: [tutti, classificati, legacy]
        - name: da
          in: query
          schema: { type: string, format: date }
        - name: a
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Contatori delle viste Sociali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventiRiepilogoViste"

  /interventi/operatori:
    get:
      operationId: listInterventiOperatori
      tags: [interventi]
      description: Operatori assegnabili o già presenti negli interventi Sociali visibili al chiamante.
      parameters:
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Operatori autorizzati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterventoOperatore"

  /interventi/materiale-da-preparare:
    get:
      operationId: getMaterialeDaPreparare
      tags: [interventi]
      description: Aggrega in una singola lettura i materiali residui degli interventi Sociali futuri autorizzati. Non genera movimenti di magazzino.
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [oggi, "3", "7", "14", personalizzato]
            default: "7"
        - name: da
          in: query
          description: Data civile Europe/Rome, obbligatoria per periodo personalizzato.
          schema: { type: string, format: date }
        - name: a
          in: query
          description: Data civile Europe/Rome inclusiva; massimo 31 giorni.
          schema: { type: string, format: date }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Aggregazione dei materiali residui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialeDaPreparare" }
        "400": { description: Intervallo non valido }
        "403": { description: Ambito o territorio non consentiti }

  /interventi/{id}:
    get:
      operationId: getIntervento
      tags: [interventi]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Intervention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"
    patch:
      operationId: updateIntervento
      tags: [interventi]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"

  /interventi/{id}/operativita:
    get:
      operationId: getInterventoOperativita
      tags: [interventi]
      description: Restituisce attività, materiali e documenti dell'intervento Sociale applicando lo stesso scope territoriale dell'intervento.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Dati operativi strutturati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventoOperativita"
        "403": { description: Intervento Sociale non accessibile }
        "404": { description: Intervento non trovato }

  /interventi/{id}/materiali/{materialeId}:
    patch:
      operationId: aggiornaStatoPreparazioneMateriale
      tags: [interventi]
      description: Aggiorna soltanto lo stato di preparazione del materiale con controllo di concorrenza; non modifica giacenze o movimenti.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: materialeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MaterialePreparazioneUpdateInput" }
      responses:
        "200":
          description: Materiale aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterventoMateriale" }
        "404": { description: Materiale non appartenente all'intervento }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/avvia:
    post:
      operationId: avviaIntervento
      tags: [interventi]
      description: Avvia atomicamente un intervento Sociale da pianificare o pianificato, senza modificare l'operatore assegnato.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoAvvioInput"
      responses:
        "200":
          description: Intervento avviato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/salva-operativita:
    post:
      operationId: salvaInterventoOperativita
      tags: [interventi]
      description: Salva in una transazione i dati operativi senza chiudere l'intervento. È utilizzabile prima dell'avvio per materiali e documenti previsti.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoOperativitaInput"
      responses:
        "200":
          description: Dati salvati; lo stato non cambia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterventoOperativita" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato terminale o versione concorrente }

  /interventi/{id}/concludi:
    post:
      operationId: concludiIntervento
      tags: [interventi]
      description: Conclude l'intervento e, se richiesto, crea atomicamente un successivo collegato. Il permesso complete consente risultato, esito e note finali; attività, materiali o documenti richiedono anche il permesso update.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventoConclusioneInput" }
      responses:
        "200":
          description: Intervento concluso
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/InterventoConclusioneResult" }
        "400":
          {
            description: "Versione obbligatoria, risultato, esito o successivo non validi",
          }
        "409": { description: Conclusione concorrente o stato non consentito }

  /interventi/{id}/annulla:
    post:
      operationId: annullaIntervento
      tags: [interventi]
      description: Annulla l'intervento con motivazione obbligatoria e storico.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventoAnnullamentoInput" }
      responses:
        "200":
          description: Intervento annullato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato terminale o versione concorrente }

  /interventi/{id}/mancata-presentazione:
    post:
      operationId: registraMancataPresentazione
      tags: [interventi]
      description: Registra la mancata presentazione di un intervento pianificato senza creare un falso avvio.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/InterventoMancataPresentazioneInput",
              }
      responses:
        "200":
          description: Mancata presentazione registrata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/transizioni:
    post:
      operationId: transitionIntervento
      tags: [interventi]
      description: Esegue atomicamente una transizione di pianificazione Sociale (da_pianificare ↔ pianificato) e la registra nello storico append-only. Avvio, conclusione, annullamento e mancata presentazione Sociali richiedono i rispettivi comandi dedicati; il comportamento UDS resta compatibile con il workflow esistente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoTransizioneInput"
      responses:
        "200":
          description: Intervento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"
        "400":
          description: Dati o timestamp non validi
        "403":
          description: Intervento non accessibile
        "409":
          description: Transizione non consentita

  /interventi/{id}/storico-stati:
    get:
      operationId: listInterventoStoricoStati
      tags: [interventi]
      parameters:
        - name: id
          in: path
