    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getMensa
      tags: [mensa]
      responses:
        "200":
          description: Dettaglio Mensa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
    patch:
      operationId: updateMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaUpdate" }
      responses:
        "200":
          description: Mensa aggiornata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
        "409": { description: Versione superata }

