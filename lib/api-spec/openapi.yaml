        riferimentoEsterno: { type: string, minLength: 3, maxLength: 500 }
    FseCancelInput:
      type: object
      required: [versione, motivazione]
      properties:
        versione: { type: integer, minimum: 1 }
        motivazione: { type: string, minLength: 3, maxLength: 500 }
    FseReconciliationInput:
      type: object
      required: [magazzinoId, importazioneAgeaId, dataRiferimento]
      properties:
        magazzinoId: { type: integer, minimum: 1 }
        importazioneAgeaId: { type: integer, minimum: 1 }
        importazioneAgeaPrecedenteId: { type: [integer, "null"], minimum: 1 }
        dataRiferimento: { type: string, format: date }
        maxMovimentoId: { type: integer, minimum: 1 }
        maxOperazioneDistribuzioneId: { type: integer, minimum: 1 }
    FseResolutionInput:
      type: object
      required: [versione, azione, motivazione]
      properties:
        versione: { type: integer, minimum: 1 }
        azione:
          type: string
          enum:
            [
              ABBINA,
              DISABBINA,
              ACCETTA_SCOSTAMENTO,
              SEGNALA_DA_CORREGGERE,
              RIAPRI,
            ]
        motivazione: { type: string, minLength: 3, maxLength: 500 }
        movimentoId: { type: integer, minimum: 1 }
        importazioneAgeaRigaId: { type: integer, minimum: 1 }
    FseMonitoringInput:
      type: object
      required:
        [
          magazzinoId,
          annoMese,
          canaleUfficiale,
          dataRiferimento,
          fonte,
          completezza,
        ]
      additionalProperties: true
      properties:
        magazzinoId: { type: integer, minimum: 1 }
        annoMese: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        canaleUfficiale: { type: string, enum: [PACCHI, MENSA, STRADA] }
        dataRiferimento: { type: string, format: date }
        operazioneDistribuzioneId: { type: [integer, "null"], minimum: 1 }
        fonte:
          type: string
          enum: [RILEVAZIONE_MANUALE_VERIFICATA, DERIVAZIONE_STRUTTURATA]
        completezza: { type: string, enum: [PARZIALE, COMPLETA] }
