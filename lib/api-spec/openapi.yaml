openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Magazzino Solidale AIM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: magazzini
  - name: prodotti
  - name: carichi
  - name: agea
  - name: fse
  - name: lotti
  - name: movimenti
  - name: giacenze
  - name: trasferimenti
  - name: scarichi
  - name: fornitori
  - name: approvvigionamenti
  - name: beneficiari
  - name: interventi
  - name: consegne
  - name: bolle
  - name: maps
  - name: volontari
  - name: mezzi
  - name: approvazioni-logistica
  - name: report
  - name: auth
  - name: utenti
  - name: ruoli
  - name: aree
  - name: aree-operative
  - name: zone-uds
  - name: uds
  - name: politiche-credito-solidale
  - name: credito-solidale
  - name: accessi-emporio
  - name: cassa-emporio
  - name: spese-emporio
  - name: configurazione-ambiente
  - name: super-admin
  - name: mensa

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check per database e migration ledger
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503": { description: Database o migration ledger non pronti }

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: KPI summary for dashboard
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Active alerts (low stock, expiring lots, pending deliveries)
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/movimenti-recenti:
    get:
      operationId: getMovimentiRecenti
      tags: [dashboard]
      summary: Recent stock movements for activity feed
      responses:
        "200":
          description: Recent movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimentoSummary"

  # ─── MAGAZZINI ───────────────────────────────────────────────────────────────
  /magazzini:
    get:
      operationId: listMagazzini
      tags: [magazzini]
      summary: List all warehouses
      responses:
        "200":
          description: List of warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Magazzino"
    post:
      operationId: createMagazzino
      tags: [magazzini]
      summary: Create a warehouse
      description: >-
        Creates a warehouse. When tipoMagazzino is mensa, areaOperativaId (the Area)
        is required and the operational Mensa detail is created atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagazzinoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"

  /magazzini/{id}:
    get:
      operationId: getMagazzino
      tags: [magazzini]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"
    patch:
      operationId: updateMagazzino
      tags: [magazzini]
      description: >-
        Updates a warehouse. Mensa warehouse changes are propagated to the
        operational Mensa detail; an existing Mensa cannot be changed to a
        different warehouse type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagazzinoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"
        "409":
          description: The requested type change is incompatible with an existing Mensa
    delete:
      operationId: deleteMagazzino
      tags: [magazzini]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deactivated without deleting historical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
        "409":
          description: >-
            The warehouse is referenced by an issued delivery note or by
            operational history and must be deactivated instead

  # ─── PRODOTTI ────────────────────────────────────────────────────────────────
  /prodotti:
    get:
      operationId: listProdotti
      tags: [prodotti]
      summary: List products
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prodotto"
    post:
      operationId: createProdotto
      tags: [prodotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"

  /prodotti/bulk:
    post:
      operationId: bulkProdotti
      tags: [prodotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottiBulkInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /prodotti/{id}:
    get:
      operationId: getProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
    patch:
      operationId: updateProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
    delete:
      operationId: deleteProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deactivated without deleting historical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"

  # ─── CARICHI MAGAZZINO 2.0 ───────────────────────────────────────────────────
  /carichi:
    get:
      operationId: listCarichi
      tags: [carichi]
      parameters:
        - name: magazzinoId
          in: query
          schema: { type: integer }
        - name: origineCarico
          in: query
          schema:
            $ref: "#/components/schemas/OrigineCarico"
        - name: da
          in: query
          schema: { type: string, format: date }
        - name: a
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Elenco delle testate di carico visibili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaricoMagazzino"
    post:
      operationId: createCarico
      tags: [carichi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaricoMagazzinoInput"
      responses:
        "200":
          description: Replay idempotente verificato per contenuto e Magazzino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaricoMagazzinoDettaglio"
        "201":
          description: Carico multi-riga contabilizzato atomicamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaricoMagazzinoDettaglio"

  /carichi/{id}:
    get:
      operationId: getCarico
      tags: [carichi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Carico con righe e Partite collegate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaricoMagazzinoDettaglio"

  /carichi/{id}/righe:
    get:
      operationId: listCaricoRighe
      tags: [carichi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Righe del carico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaricoMagazzinoRiga"

  # ─── IMPORT AGEA/SIFEAD 2.0B ────────────────────────────────────────────────
  /agea/importazioni:
    get:
      operationId: listAgeaImportazioni
      tags: [agea]
      summary: Elenca le importazioni AGEA visibili nello scope Magazzino/Area/Centro
      responses:
        "200":
          description: Importazioni visibili
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgeaImportazione" }

  /agea/importazioni/analizza:
    post:
      operationId: analyzeAgeaImportazione
      tags: [agea]
      summary: Analizza localmente un registro XLSX senza modificare lo stock
      parameters:
        - {
            name: magazzinoId,
            in: query,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            name: modalita,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/AgeaImportModalita" },
          }
        - {
            name: nomeFile,
            in: query,
            required: true,
            schema: { type: string, maxLength: 255, pattern: ".*\\.xlsx$" },
          }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Staging creato e preflight eseguito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "413": { $ref: "#/components/responses/AgeaPayloadTooLarge" }
        "415": { $ref: "#/components/responses/AgeaUnsupportedMediaType" }

  /agea/importazioni/{id}:
    get:
      operationId: getAgeaImportazione
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Importazione
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }

  /agea/importazioni/{id}/righe:
    get:
      operationId: listAgeaImportazioneRighe
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: stato, in: query, schema: { type: string } }
        - { name: fondo, in: query, schema: { type: string } }
        - {
            name: tipo,
            in: query,
            schema: { $ref: "#/components/schemas/AgeaTipoMovimento" },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Preview paginata delle righe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportRighePage" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }

  /agea/importazioni/{id}/partite:
    get:
      operationId: listAgeaImportazionePartite
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Partite di preview
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgeaImportPartita" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }

  /agea/importazioni/{id}/descrizioni-da-mappare:
    get:
      operationId: listAgeaImportazioneDescrizioniDaMappare
      tags: [agea]
      summary: Elenca le descrizioni esterne distinte dell'intera importazione
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Descrizioni, frequenze, fondi e mapping corrente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgeaDescrizioneDaMappare" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }

  /agea/importazioni/{id}/righe/{rigaId}/data-carico:
    patch:
      operationId: updateAgeaImportazioneRigaDataCarico
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: rigaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaCorrezioneDataInput" }
      responses:
        "200":
          description: Importazione con preview ricostruita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/importazioni/{id}/righe/{rigaId}/lotto:
    patch:
      operationId: updateAgeaImportazioneRigaLotto
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: rigaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaCorrezioneLottoInput" }
      responses:
        "200":
          description: Importazione con preview ricostruita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/importazioni/{id}/partite/{partitaId}:
    patch:
      operationId: updateAgeaImportazionePartita
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: partitaId,
            in: path,
            required: true,
            schema: { type: integer },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaImportPartitaUpdate" }
      responses:
        "200":
          description: Scadenza aggiornata e preview ricostruita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/importazioni/{id}/ricalcola:
    post:
      operationId: recalculateAgeaImportazione
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaVersioneInput" }
      responses:
        "200":
          description: Preflight ricalcolato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/importazioni/{id}/conferma:
    post:
      operationId: confirmAgeaImportazione
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaImportConfermaInput" }
      responses:
        "200":
          description: Conferma atomica o replay idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportConfermaResult" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/importazioni/{id}/annulla:
    post:
      operationId: cancelAgeaImportazione
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaVersioneInput" }
      responses:
        "200":
          description: Importazione non confermata annullata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaImportazione" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/mappature-prodotti:
    get:
      operationId: listAgeaMappatureProdotti
      tags: [agea]
      responses:
        "200":
          description: Mapping globali AGEA
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgeaMappaturaProdotto" }
    post:
      operationId: createAgeaMappaturaProdotto
      tags: [agea]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaMappaturaProdottoInput" }
      responses:
        "201":
          description: Mapping associato esplicitamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaMappaturaProdotto" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  /agea/mappature-prodotti/{id}:
    patch:
      operationId: updateAgeaMappaturaProdotto
      tags: [agea]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgeaMappaturaProdottoUpdate" }
      responses:
        "200":
          description: Mapping aggiornato senza alterare gli snapshot storici
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeaMappaturaProdotto" }
        "400": { $ref: "#/components/responses/AgeaBadRequest" }
        "403": { $ref: "#/components/responses/AgeaForbidden" }
        "404": { $ref: "#/components/responses/AgeaNotFound" }
        "409": { $ref: "#/components/responses/AgeaConflict" }

  # ─── RENDICONTAZIONE FSE+ 2.0C ─────────────────────────────────────────────
  /fse/rendicontazione/preview:
    get:
      operationId: getFseReportingPreview
      tags: [fse]
      summary: Preview canonica FSE+ con cutoff immutabile
      parameters:
        - { $ref: "#/components/parameters/FseMagazzinoId" }
        - { $ref: "#/components/parameters/FseDataDa" }
        - { $ref: "#/components/parameters/FseDataA" }
        - { $ref: "#/components/parameters/FseDataAsOf" }
        - { $ref: "#/components/parameters/FseIncludeArretrati" }
      responses:
        "200":
          {
            description: Preview,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/FseReportingPreview" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/FseBadRequest" }
        "403": { $ref: "#/components/responses/FseForbidden" }
  /fse/rendicontazione/eventi:
    get:
      operationId: listFseReportingEvents
      tags: [fse]
      parameters:
        - { $ref: "#/components/parameters/FseMagazzinoId" }
        - { $ref: "#/components/parameters/FseDataDa" }
        - { $ref: "#/components/parameters/FseDataA" }
        - { $ref: "#/components/parameters/FseIncludeArretrati" }
        - { $ref: "#/components/parameters/FsePage" }
        - { $ref: "#/components/parameters/FsePageSize" }
        - { $ref: "#/components/parameters/FseQueueStato" }
        - { $ref: "#/components/parameters/FseQueueCanale" }
        - { $ref: "#/components/parameters/FseQueueFondo" }
        - { $ref: "#/components/parameters/FseQueueProdottoId" }
        - { $ref: "#/components/parameters/FseQueueQualityCode" }
      responses:
        "200":
          {
            description: Eventi canonici,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/FseRecordPage" } },
              },
          }
        "400": { $ref: "#/components/responses/FseBadRequest" }
        "403": { $ref: "#/components/responses/FseForbidden" }
  /fse/rendicontazione/righe:
    get:
      operationId: listFseReportingLines
      tags: [fse]
      parameters:
        - { $ref: "#/components/parameters/FseMagazzinoId" }
        - { $ref: "#/components/parameters/FseDataDa" }
