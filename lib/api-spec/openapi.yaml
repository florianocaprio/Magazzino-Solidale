    post:
      operationId: createBisognoPianificato
      tags: [interventi]
      parameters:
        - name: interventoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BisognoPianificatoInput"
      responses:
        "201":
          description: Bisogno Pianificato creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BisognoPianificato"
        "400":
          description: Dati non validi
        "403":
          description: Intervento non accessibile per la area operativa dell'operatore
        "404":
          description: Intervento non trovato

  /interventi/{interventoId}/bisogni-pianificati/{bisognoId}:
    patch:
      operationId: updateBisognoPianificato
      tags: [interventi]
      parameters:
        - name: interventoId
          in: path
          required: true
          schema:
            type: integer
        - name: bisognoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BisognoPianificatoUpdate"
      responses:
        "200":
          description: Bisogno Pianificato aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BisognoPianificato"
        "400":
          description: Dati non validi
        "403":
          description: Intervento non accessibile per la area operativa dell'operatore
        "404":
          description: Intervento o Bisogno Pianificato non trovato
        "409":
          description: Versione non aggiornata

  /interventi/{interventoId}/bisogni-pianificati/{bisognoId}/storico:
    get:
      operationId: listBisognoPianificatoStorico
      tags: [interventi]
      parameters:
        - name: interventoId
          in: path
          required: true
          schema: { type: integer }
        - name: bisognoId
          in: path
          required: true
          schema: { type: integer }
      responses:
