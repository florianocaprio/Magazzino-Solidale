openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Magazzino Solidale AIM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: magazzini
  - name: prodotti
  - name: lotti
  - name: movimenti
  - name: giacenze
  - name: trasferimenti
  - name: scarichi
  - name: fornitori
  - name: approvvigionamenti
  - name: beneficiari
  - name: interventi
  - name: consegne
  - name: bolle
  - name: maps
  - name: volontari
  - name: mezzi
  - name: approvazioni-logistica
  - name: report
  - name: auth
  - name: utenti
  - name: ruoli
  - name: aree
  - name: aree-operative
  - name: zone-uds
  - name: politiche-credito-solidale
  - name: credito-solidale
  - name: accessi-emporio
  - name: cassa-emporio
  - name: spese-emporio
  - name: configurazione-ambiente
  - name: super-admin
  - name: mensa

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: KPI summary for dashboard
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Active alerts (low stock, expiring lots, pending deliveries)
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/movimenti-recenti:
    get:
      operationId: getMovimentiRecenti
      tags: [dashboard]
      summary: Recent stock movements for activity feed
      responses:
        "200":
          description: Recent movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimentoSummary"

  # ─── MAGAZZINI ───────────────────────────────────────────────────────────────
  /magazzini:
    get:
      operationId: listMagazzini
      tags: [magazzini]
      summary: List all warehouses
      responses:
        "200":
          description: List of warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Magazzino"
    post:
      operationId: createMagazzino
      tags: [magazzini]
      summary: Create a warehouse
      description: >-
        Creates a warehouse. When tipoMagazzino is mensa, areaOperativaId (the Area)
        is required and the operational Mensa detail is created atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagazzinoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"

  /magazzini/{id}:
    get:
      operationId: getMagazzino
      tags: [magazzini]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"
    patch:
      operationId: updateMagazzino
      tags: [magazzini]
      description: >-
        Updates a warehouse. Mensa warehouse changes are propagated to the
        operational Mensa detail; an existing Mensa cannot be changed to a
        different warehouse type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagazzinoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Magazzino"
        "409":
          description: The requested type change is incompatible with an existing Mensa
    delete:
      operationId: deleteMagazzino
      tags: [magazzini]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deactivated without deleting historical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
        "409":
          description: >-
            The warehouse is referenced by an issued delivery note or by
            operational history and must be deactivated instead

  # ─── PRODOTTI ────────────────────────────────────────────────────────────────
  /prodotti:
    get:
      operationId: listProdotti
      tags: [prodotti]
      summary: List products
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prodotto"
    post:
      operationId: createProdotto
      tags: [prodotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"

  /prodotti/bulk:
    post:
      operationId: bulkProdotti
      tags: [prodotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottiBulkInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /prodotti/{id}:
    get:
      operationId: getProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
    patch:
      operationId: updateProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdottoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prodotto"
    delete:
      operationId: deleteProdotto
      tags: [prodotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deactivated without deleting historical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"

  # ─── LOTTI ───────────────────────────────────────────────────────────────────
  /lotti:
    get:
      operationId: listLotti
      tags: [lotti]
      parameters:
        - name: prodottoId
          in: query
          schema:
            type: integer
        - name: magazzinoId
          in: query
          schema:
            type: integer
        - name: inScadenza
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lotto"
    post:
      operationId: createLotto
      tags: [lotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LottoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

  /lotti/{id}:
    get:
      operationId: getLotto
      tags: [lotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

  /lotti/{id}/rettifica:
    post:
      operationId: rettificaLotto
      tags: [lotti]
      summary: Registra una rettifica inventariale atomica e auditata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RettificaLottoInput"
      responses:
        "200":
          description: Lot adjusted and movement appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"
    patch:
      operationId: updateLotto
      tags: [lotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LottoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

  # ─── MOVIMENTI ───────────────────────────────────────────────────────────────
  /movimenti:
    get:
      operationId: listMovimenti
      tags: [movimenti]
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
        - name: magazzinoId
          in: query
          schema:
            type: integer
        - name: prodottoId
          in: query
          schema:
            type: integer
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: da
          in: query
          schema:
            type: string
        - name: a
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: List of movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movimento"

  # ─── GIACENZE ────────────────────────────────────────────────────────────────
  /giacenze:
    get:
      operationId: listGiacenze
      tags: [giacenze]
      parameters:
        - name: magazzinoId
          in: query
          schema:
            type: integer
        - name: sottoscortaOnly
          in: query
          schema:
            type: boolean
        - name: fsePlusOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Giacenza"

  # ─── PREPARAZIONE CONSEGNE ───────────────────────────────────────────────────
  /preparazione-consegne:
    get:
      operationId: getPreparazioneConsegne
      tags: [preparazione-consegne]
      summary: Goods to prepare for planned deliveries of a warehouse
      parameters:
        - name: areaOperativaId
          in: query
          schema:
            type: integer
        - name: magazzinoId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Aggregated goods to prepare + included deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparazioneConsegne"

  # ─── TRASFERIMENTI ───────────────────────────────────────────────────────────
  /trasferimenti:
    get:
      operationId: listTrasferimenti
      tags: [trasferimenti]
      parameters:
        - name: stato
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trasferimento"
    post:
      operationId: createTrasferimento
      tags: [trasferimenti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrasferimentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"

  /trasferimenti/{id}:
    get:
      operationId: getTrasferimento
      tags: [trasferimenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"
    patch:
      operationId: updateTrasferimento
      tags: [trasferimenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrasferimentoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"

  /trasferimenti/{id}/avvia:
    post:
      operationId: avviaTrasferimento
      tags: [trasferimenti]
      summary: Phase 1 - start transfer (deduct from origin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersioneInput"
      responses:
        "200":
          description: Transfer started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"

  /trasferimenti/{id}/documento:
    get:
      operationId: getDocumentoTrasferimento
      tags: [trasferimenti]
      summary: Recupera e audita i dati della bolla di trasferimento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dati del documento logistico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"

  /trasferimenti/{id}/conferma:
    post:
      operationId: confermaTrasferimento
      tags: [trasferimenti]
      summary: Phase 2 - confirm receipt (add to destination)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfermaRicezione"
      responses:
        "200":
          description: Transfer confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trasferimento"

  /scarichi:
    get:
      operationId: listScarichi
      tags: [scarichi]
      parameters:
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: List of warehouse discharges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scarico"
    post:
      operationId: createScarico
      tags: [scarichi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaricoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scarico"

  /scarichi/{id}:
    get:
      operationId: getScarico
      tags: [scarichi]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discharge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scarico"

  # ─── FORNITORI ───────────────────────────────────────────────────────────────
  /fornitori:
    get:
      operationId: listFornitori
      tags: [fornitori]
      parameters:
        - name: areaOperativaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fornitore"
    post:
      operationId: createFornitore
      tags: [fornitori]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FornitoreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"

  /fornitori/bulk:
    post:
      operationId: bulkFornitori
      tags: [fornitori]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FornitoriBulkInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /fornitori/{id}:
    get:
      operationId: getFornitore
      tags: [fornitori]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"
    patch:
      operationId: updateFornitore
      tags: [fornitori]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FornitoreUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"
    delete:
      operationId: deleteFornitore
      tags: [fornitori]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier deactivated without deleting historical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fornitore"

  # ─── APPROVVIGIONAMENTI ──────────────────────────────────────────────────────
  /approvvigionamenti:
    get:
      operationId: listApprovvigionamenti
      tags: [approvvigionamenti]
      parameters:
        - name: stato
          in: query
          schema:
            type: string
        - name: magazzinoId
          in: query
          schema:
            type: integer
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: List of procurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approvvigionamento"
    post:
      operationId: createApprovvigionamento
      tags: [approvvigionamenti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovvigionamentoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approvvigionamento"

  /approvvigionamenti/{id}:
    get:
      operationId: getApprovvigionamento
      tags: [approvvigionamenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Procurement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approvvigionamento"
    patch:
      operationId: updateApprovvigionamento
      tags: [approvvigionamenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovvigionamentoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approvvigionamento"

  /approvvigionamenti/{id}/sottometti:
    post:
      operationId: submitApprovvigionamento
      tags: [approvvigionamenti]
      summary: Submit a draft order (sets stato=sottomesso and emails amministrazione)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersioneInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approvvigionamento"

  /approvvigionamenti/{id}/invia-email:
    post:
      operationId: sendApprovvigionamentoEmail
      tags: [approvvigionamenti]
      summary: Manually (re)send the order email to amministrazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendResult"

  # ─── TURNI (Pianificazione Turni Sociale) ──────────────────────────────────
  /turni:
    get:
      operationId: listTurni
      tags: [turni]
      parameters:
        - name: da
          in: query
          schema:
            type: string
        - name: a
          in: query
          schema:
            type: string
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Turno"
    put:
      operationId: upsertTurno
      tags: [turni]
      summary: Create or replace a shift (centro+data+fascia) and its volunteers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoInput"
      responses:
        "200":
          description: Upserted shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turno"

  /turni/volontari-pending:
    post:
      operationId: createTurnoVolontarioPending
      tags: [turni]
      summary: Create a pending volunteer from shift planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoVolontarioPendingInput"
      responses:
        "201":
          description: Pending volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volontario"

  /turni/mezzi-pending:
    post:
      operationId: createTurnoMezzoPending
      tags: [turni]
      summary: Create a pending vehicle from shift planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoMezzoPendingInput"
      responses:
        "201":
          description: Pending vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mezzo"

  /turni/{id}:
    delete:
      operationId: deleteTurno
      tags: [turni]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── BENEFICIARI ─────────────────────────────────────────────────────────────
  /beneficiari:
    get:
      operationId: listBeneficiari
      tags: [beneficiari]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: priorita
          in: query
          schema:
            type: string
        - name: domicilio
          in: query
          schema:
            type: boolean
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: areaOperativaId
          in: query
          schema:
            type: integer
        - name: zonaUdsId
          in: query
          schema:
            type: integer
        - name: uds
          in: query
          schema:
            type: boolean
        - name: attivo
          in: query
          schema:
            type: boolean
        - name: statoAnagrafica
          in: query
          description: Filtra le anagrafiche complete o quelle provvisorie ancora da completare.
          schema:
            type: string
            enum: [provvisoria, completa]
        - name: page
          in: query
          description: Pagina richiesta, a partire da 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Numero massimo di risultati per pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: List of beneficiaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeneficiarioDirectory"
    post:
      operationId: createBeneficiario
      tags: [beneficiari]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiario"

  /beneficiari/cerca-simili:
    get:
      operationId: cercaBeneficiariSimili
      tags: [beneficiari]
      summary: Ricerca persone e suggerimenti anti-duplicato all'interno di una sola Area
      parameters:
        - name: search
          in: query
          description: Free-text lookup over names in both orders, nickname, phone, beneficiary code and tax code; at least 2 characters
          schema:
            type: string
            minLength: 2
        - name: nome
          in: query
          schema:
            type: string
        - name: cognome
          in: query
          schema:
            type: string
        - name: soprannome
          in: query
          schema:
            type: string
        - name: telefono
          in: query
          schema:
            type: string
        - name: dataNascita
          in: query
          schema:
            type: string
        - name: areaOperativaId
          in: query
          description: Obbligatorio per utenti globali; per utenti territoriali viene sempre usata la propria Area.
          schema:
            type: integer
            minimum: 1
        - name: excludeId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Possible existing matches ordered by similarity score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeneficiarioSimile"
        "400":
          description: A global user omitted areaOperativaId or supplied an invalid value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /beneficiari/bulk:
    post:
      operationId: bulkBeneficiari
      tags: [beneficiari]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiariBulkInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /beneficiari/{id}:
    get:
      operationId: getBeneficiario
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beneficiary with family and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiarioDettaglio"
    patch:
      operationId: updateBeneficiario
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiarioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiario"
        "409":
          description: La versione inviata non è più corrente
    delete:
      operationId: deleteBeneficiario
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Beneficiario disattivato; storico preservato

  /beneficiari/{id}/stato:
    patch:
      operationId: updateBeneficiarioStato
      tags: [beneficiari]
      summary: Disattiva o riattiva un beneficiario preservandone lo storico
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiarioStatoInput"
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiario"
        "409":
          description: La versione inviata non è più corrente

  /beneficiari/export/authorize:
    post:
      operationId: authorizeBeneficiariExport
      tags: [beneficiari]
      summary: Autorizza e registra nell'audit un'esportazione di dati beneficiari
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiariExportInput"
      responses:
        "200":
          description: Esportazione autorizzata e auditata
          content:
            application/json:
              schema:
                type: object
                required: [autorizzato, auditId]
                properties:
                  autorizzato: { type: boolean }
                  auditId: { type: integer }

  /beneficiari/{id}/nucleo:
    get:
      operationId: getNucleoFamiliare
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NucleoFamiliare"
    post:
      operationId: addNucleoFamiliare
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoFamiliareInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoFamiliare"

  /beneficiari/{id}/nucleo/{membroId}:
    patch:
      operationId: updateNucleoFamiliare
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: membroId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NucleoFamiliareInput"
      responses:
        "200":
          description: Membro aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NucleoFamiliare"
    delete:
      operationId: deleteNucleoFamiliare
      tags: [beneficiari]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: membroId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /beneficiari/{id}/tessere:
    get:
      operationId: listTessereBeneficiarioDaAnagrafica
      tags: [beneficiari]
      summary: Elenca le tessere trasversali del beneficiario, inclusa l'eventuale tessera legacy attiva
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tessere del beneficiario dalla più recente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TesseraBeneficiario" }
        "403": { description: Permesso o scope territoriale non consentito }
    post:
      operationId: createTesseraBeneficiarioDaAnagrafica
      tags: [beneficiari]
      summary: Emette una tessera trasversale opaca da un'anagrafica autorizzata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/TesseraBeneficiarioAnagraficaInput",
              }
      responses:
        "201":
          description: Tessera emessa senza dati personali nel token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TesseraBeneficiario" }
        "403": { description: Permesso o scope territoriale non consentito }
        "409": { description: Esiste già una tessera attiva }

  # ─── INTERVENTI ──────────────────────────────────────────────────────────────
  /interventi:
    get:
      operationId: listInterventi
      tags: [interventi]
      parameters:
        - name: beneficiarioId
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            type: string
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: areaOperativaId
          in: query
          schema:
            type: integer
        - name: bisogni
          in: query
          description: Filtra gli interventi in base ai Bisogni Pianificati collegati.
          schema:
            type: string
            enum: [aperti, scaduti, nessuno]
        - name: stato
          in: query
          schema:
            $ref: "#/components/schemas/InterventoStato"
        - name: ambito
          in: query
          schema:
            $ref: "#/components/schemas/InterventoAmbito"
        - name: includiStorici
          in: query
          description: Se true e ambito è valorizzato, include anche gli interventi storici non classificati (ambito null). Il filtro di ambito resta esatto quando è omesso o false.
          schema:
            type: boolean
            default: false
        - name: operatoreId
          in: query
          schema:
            type: integer
        - name: priorita
          in: query
          schema:
            $ref: "#/components/schemas/InterventoPriorita"
        - name: pianificataDa
          in: query
          description: Estremo iniziale ISO 8601 con fuso dell'intervallo pianificato.
          schema:
            type: string
            format: date-time
        - name: pianificataA
          in: query
          description: Estremo finale ISO 8601 con fuso dell'intervallo pianificato.
          schema:
            type: string
            format: date-time
        - name: interventoPrecedenteId
          in: query
          schema:
            type: integer
        - name: vista
          in: query
          description: Vista operativa Sociale; richiede ambito=sociale. Oggi e i relativi confini civili sono calcolati in Europe/Rome.
          schema:
            $ref: "#/components/schemas/InterventoVista"
        - name: ricerca
          in: query
          description: Ricerca beneficiario per nome, cognome, nome completo o codice.
          schema:
            type: string
            maxLength: 120
        - name: da
          in: query
          description: Data civile iniziale inclusiva Europe/Rome; deve essere usata insieme ad a.
          schema:
            type: string
            format: date
        - name: a
          in: query
          description: Data civile finale inclusiva Europe/Rome; intervallo massimo 366 giorni.
          schema:
            type: string
            format: date
        - name: ordina
          in: query
          schema:
            type: string
            enum: [data, priorita, beneficiario, operatore]
        - name: direzione
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: ambitoLegacy
          in: query
          description: Selezione conservativa dei record Sociali classificati o con ambito storico non determinato.
          schema:
            type: string
            enum: [tutti, classificati, legacy]
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Per l'ambito Sociale restituisce una proiezione minimale senza note, descrizione, risultato o altri contenuti estesi; il dettaglio completo è disponibile su GET /interventi/{id}. L'ambito UDS conserva il DTO storico completo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intervento"
    post:
      operationId: createIntervento
      tags: [interventi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"

  /interventi/riepilogo-viste:
    get:
      operationId: getInterventiRiepilogoViste
      tags: [interventi]
      description: Restituisce in una singola query aggregata i contatori delle viste Sociali autorizzate, includendo conservativamente i record legacy.
      parameters:
        - name: beneficiarioId
          in: query
          schema: { type: integer }
        - name: ricerca
          in: query
          schema: { type: string, maxLength: 120 }
        - name: tipo
          in: query
          schema: { type: string }
        - name: priorita
          in: query
          schema: { $ref: "#/components/schemas/InterventoPriorita" }
        - name: operatoreId
          in: query
          schema: { type: integer }
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
        - name: stato
          in: query
          schema: { $ref: "#/components/schemas/InterventoStato" }
        - name: ambitoLegacy
          in: query
          schema:
            type: string
            enum: [tutti, classificati, legacy]
        - name: da
          in: query
          schema: { type: string, format: date }
        - name: a
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Contatori delle viste Sociali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventiRiepilogoViste"

  /interventi/operatori:
    get:
      operationId: listInterventiOperatori
      tags: [interventi]
      description: Operatori assegnabili o già presenti negli interventi Sociali visibili al chiamante.
      parameters:
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Operatori autorizzati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterventoOperatore"

  /interventi/materiale-da-preparare:
    get:
      operationId: getMaterialeDaPreparare
      tags: [interventi]
      description: Aggrega in una singola lettura i materiali residui degli interventi Sociali futuri autorizzati. Non genera movimenti di magazzino.
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [oggi, "3", "7", "14", personalizzato]
            default: "7"
        - name: da
          in: query
          description: Data civile Europe/Rome, obbligatoria per periodo personalizzato.
          schema: { type: string, format: date }
        - name: a
          in: query
          description: Data civile Europe/Rome inclusiva; massimo 31 giorni.
          schema: { type: string, format: date }
        - name: areaOperativaId
          in: query
          schema: { type: integer }
        - name: centroAscoltoId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Aggregazione dei materiali residui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialeDaPreparare" }
        "400": { description: Intervallo non valido }
        "403": { description: Ambito o territorio non consentiti }

  /interventi/{id}:
    get:
      operationId: getIntervento
      tags: [interventi]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Intervention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"
    patch:
      operationId: updateIntervento
      tags: [interventi]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"

  /interventi/{id}/operativita:
    get:
      operationId: getInterventoOperativita
      tags: [interventi]
      description: Restituisce attività, materiali e documenti dell'intervento Sociale applicando lo stesso scope territoriale dell'intervento.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Dati operativi strutturati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventoOperativita"
        "403": { description: Intervento Sociale non accessibile }
        "404": { description: Intervento non trovato }

  /interventi/{id}/materiali/{materialeId}:
    patch:
      operationId: aggiornaStatoPreparazioneMateriale
      tags: [interventi]
      description: Aggiorna soltanto lo stato di preparazione del materiale con controllo di concorrenza; non modifica giacenze o movimenti.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: materialeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MaterialePreparazioneUpdateInput" }
      responses:
        "200":
          description: Materiale aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterventoMateriale" }
        "404": { description: Materiale non appartenente all'intervento }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/avvia:
    post:
      operationId: avviaIntervento
      tags: [interventi]
      description: Avvia atomicamente un intervento Sociale da pianificare o pianificato, senza modificare l'operatore assegnato.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoAvvioInput"
      responses:
        "200":
          description: Intervento avviato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/salva-operativita:
    post:
      operationId: salvaInterventoOperativita
      tags: [interventi]
      description: Salva in una transazione i dati operativi senza chiudere l'intervento. È utilizzabile prima dell'avvio per materiali e documenti previsti.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoOperativitaInput"
      responses:
        "200":
          description: Dati salvati; lo stato non cambia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterventoOperativita" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato terminale o versione concorrente }

  /interventi/{id}/concludi:
    post:
      operationId: concludiIntervento
      tags: [interventi]
      description: Conclude l'intervento e, se richiesto, crea atomicamente un successivo collegato. Il permesso complete consente risultato, esito e note finali; attività, materiali o documenti richiedono anche il permesso update.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventoConclusioneInput" }
      responses:
        "200":
          description: Intervento concluso
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/InterventoConclusioneResult" }
        "400":
          {
            description: "Versione obbligatoria, risultato, esito o successivo non validi",
          }
        "409": { description: Conclusione concorrente o stato non consentito }

  /interventi/{id}/annulla:
    post:
      operationId: annullaIntervento
      tags: [interventi]
      description: Annulla l'intervento con motivazione obbligatoria e storico.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventoAnnullamentoInput" }
      responses:
        "200":
          description: Intervento annullato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato terminale o versione concorrente }

  /interventi/{id}/mancata-presentazione:
    post:
      operationId: registraMancataPresentazione
      tags: [interventi]
      description: Registra la mancata presentazione di un intervento pianificato senza creare un falso avvio.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/InterventoMancataPresentazioneInput",
              }
      responses:
        "200":
          description: Mancata presentazione registrata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervento" }
        "400": { description: Versione obbligatoria o richiesta non valida }
        "409": { description: Stato o versione concorrente }

  /interventi/{id}/transizioni:
    post:
      operationId: transitionIntervento
      tags: [interventi]
      description: Esegue atomicamente una transizione di pianificazione Sociale (da_pianificare ↔ pianificato) e la registra nello storico append-only. Avvio, conclusione, annullamento e mancata presentazione Sociali richiedono i rispettivi comandi dedicati; il comportamento UDS resta compatibile con il workflow esistente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoTransizioneInput"
      responses:
        "200":
          description: Intervento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"
