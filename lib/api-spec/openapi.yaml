          schema: { type: integer }
        - { name: attiva, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Mense visibili nello scope territoriale
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Mensa" } }
    post:
      operationId: createMensa
      tags: [mensa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensaInput" }
      responses:
        "201":
          description: Mensa creata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensa" }
        "400":
          description: Area, Centro di Ascolto o dati della sede non validi
        "409":
          description: Codice già utilizzato o entità associata non attiva

