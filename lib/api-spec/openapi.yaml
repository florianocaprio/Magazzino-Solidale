        - name: beneficiarioIds
          in: query
          required: false
          description: ID positivi separati da virgola, deduplicati dal server; massimo 500.
          schema: { type: string }
      responses:
        "200":
          description: Riepilogo batch; gli ID fuori scope sono omessi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MensaAbilitazioneRiepilogoBeneficiario"
