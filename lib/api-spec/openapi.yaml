        dataReso: { type: string, format: date }
        destinazioneOpc: { type: string, minLength: 3, maxLength: 500 }
        motivazione: { type: string, minLength: 3, maxLength: 2000 }
        modalitaSelezione: { type: string, enum: [FEFO, PARTITA_ESATTA] }
