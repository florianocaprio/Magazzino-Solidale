  # ─── BENEFICIARI ─────────────────────────────────────────────────────────────
  /beneficiari:
    get:
      operationId: listBeneficiari
      tags: [beneficiari]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: priorita
          in: query
          schema:
            type: string
        - name: domicilio
          in: query
          schema:
            type: boolean
        - name: centroAscoltoId
          in: query
          schema:
            type: integer
        - name: areaOperativaId
          in: query
          schema:
            type: integer
        - name: zonaUdsId
          in: query
          schema:
            type: integer
        - name: uds
          in: query
          schema:
            type: boolean
        - name: attivo
          in: query
          schema:
            type: boolean
        - name: statoAnagrafica
          in: query
          description: Filtra le anagrafiche complete o quelle provvisorie ancora da completare.
          schema:
            type: string
            enum: [provvisoria, completa]
        - name: page
          in: query
          description: Pagina richiesta, a partire da 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Numero massimo di risultati per pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: List of beneficiaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeneficiarioDirectory"
    post:
      operationId: createBeneficiario
      tags: [beneficiari]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiario"

  /beneficiari/cerca-simili:
    get:
      operationId: cercaBeneficiariSimili
      tags: [beneficiari]
      summary: Ricerca persone e suggerimenti anti-duplicato all'interno di una sola Area
      parameters:
        - name: search
          in: query
          description: Free-text lookup over names in both orders, nickname, phone, beneficiary code and tax code; at least 2 characters
          schema:
            type: string
            minLength: 2
        - name: nome
          in: query
          schema:
            type: string
        - name: cognome
          in: query
          schema:
            type: string
        - name: soprannome
          in: query
          schema:
            type: string
        - name: telefono
          in: query
          schema:
            type: string
        - name: dataNascita
          in: query
          schema:
            type: string
        - name: areaOperativaId
          in: query
          description: Obbligatorio per utenti globali; per utenti territoriali viene sempre usata la propria Area.
          schema:
            type: integer
            minimum: 1
        - name: excludeId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Possible existing matches ordered by similarity score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeneficiarioSimile"
        "400":
          description: A global user omitted areaOperativaId or supplied an invalid value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /beneficiari/bulk:
    post:
      operationId: bulkBeneficiari
      tags: [beneficiari]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiariBulkInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /beneficiari/fse/preview:
    post:
      operationId: previewBeneficiariFse
      tags: [beneficiari]
      summary: Valida e classifica il workbook FSE+ reale senza scrivere dati di dominio
      description: Richiede beneficiari.fse.import. Il server calcola SHA-256, apre il workbook e valida foglio e colonne; il Centro è verificato server-side e l'Area è sempre derivata dal Centro.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BeneficiariFseWorkbookUpload" }
      responses:
        "200":
          description: Preview e classificazione righe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiariFsePreviewResult" }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }
        "415": { $ref: "#/components/responses/BeneficiariFseBadRequest" }

  /beneficiari/fse/import:
    post:
      operationId: importBeneficiariFse
      tags: [beneficiari]
      summary: Conferma un import FSE+ rivalidando il workbook reale
      description: Richiede beneficiari.fse.import. Il server ricalcola SHA-256 e rivalida il workbook; ogni fascicolo è atomico e Area/scope sono risolti server-side.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BeneficiariFseWorkbookImportUpload" }
      responses:
        "200":
          description: Esito batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiariFseImportResult" }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }
        "415": { $ref: "#/components/responses/BeneficiariFseBadRequest" }

  /beneficiari/fse/export/preflight:
    post:
      operationId: preflightBeneficiariFseExport
      tags: [beneficiari]
      summary: Verifica tutti i beneficiari candidati prima dell'export
      description: Richiede beneficiari.fse.export. Non esclude silenziosamente record non esportabili.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeneficiariFseExportInput" }
      responses:
        "200":
          description: Candidati, esportabili e blocchi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiariFseExportPreflight" }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }

  /beneficiari/fse/export:
    post:
      operationId: exportBeneficiariFse
      tags: [beneficiari]
      summary: Genera il workbook FSE+ canonico
      description: Richiede beneficiari.fse.export. L'export è bloccato se il preflight contiene errori.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeneficiariFseExportInput" }
      responses:
        "200":
          description: Workbook FSE+ con 17 colonne canoniche
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }
        "422": { $ref: "#/components/responses/BeneficiariFseUnprocessable" }

  /beneficiari/{id}/fse:
    get:
      operationId: getBeneficiarioFse
      tags: [beneficiari]
      description: Richiede beneficiari.fse.view e applica scope Area, Centro e Zona UDS.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Profilo, snapshot e demografia del fascicolo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiarioFseDetail" }
        "400": { $ref: "#/components/responses/BeneficiariFseBadRequest" }
        "401": { $ref: "#/components/responses/BeneficiariFseUnauthorized" }
        "403": { $ref: "#/components/responses/BeneficiariFseForbidden" }
        "404": { $ref: "#/components/responses/BeneficiariFseNotFound" }
    patch:
      operationId: updateBeneficiarioFse
      tags: [beneficiari]
      description: Richiede beneficiari.fse.manage e applica scope Area, Centro e Zona UDS.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
