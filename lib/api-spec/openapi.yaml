        [magazzinoId, dataCompetenzaDa, dataCompetenzaA, dataAsOf, formatCode]
      properties:
        magazzinoId: { type: integer, minimum: 1 }
        dataCompetenzaDa: { type: string, format: date }
        dataCompetenzaA: { type: string, format: date }
        dataAsOf: { type: string, format: date }
        formatCode:
          type: string
          enum:
            [
              FSE_CANONICAL_AUDIT_XLSX_V1,
              SIFEAD_REGISTRO_OSSERVATO_CONTROLLO_V1,
            ]
        maxMovimentoId: { type: integer, minimum: 1 }
        maxOperazioneDistribuzioneId: { type: integer, minimum: 1 }
        includeArretrati: { type: boolean, default: true }
    FseVersionInput:
      type: object
      required: [versione]
      properties:
        versione: { type: integer, minimum: 1 }
        motivazione: { type: string, minLength: 3, maxLength: 500 }
        data: { type: string, format: date }
        riferimentoEsterno: { type: string, minLength: 3, maxLength: 500 }
        conScostamenti: { type: boolean }
    FseMarkEnteredInput:
      type: object
      required: [versione, data, riferimentoEsterno]
