  # ─── LOTTI ───────────────────────────────────────────────────────────────────
  /lotti:
    get:
      operationId: listLotti
      tags: [lotti]
      parameters:
        - name: prodottoId
          in: query
          schema:
            type: integer
        - name: magazzinoId
          in: query
          schema:
            type: integer
        - name: inScadenza
          in: query
          schema:
            type: boolean
        - name: fondoOrigine
          in: query
          schema:
            $ref: "#/components/schemas/FondoOrigine"
        - name: origineCaricoPresente
          in: query
          description: >-
            Restituisce Partite alimentate almeno una volta da questa origine.
            Non attribuisce la quantità residua alla provenienza selezionata.
          schema:
            $ref: "#/components/schemas/OrigineCarico"
      responses:
        "200":
          description: List of lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lotto"
    post:
      operationId: createLotto
      tags: [lotti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LottoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

  /lotti/{id}:
    get:
      operationId: getLotto
      tags: [lotti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"
    patch:
      operationId: updateLotto
      tags: [lotti]
      summary: Aggiorna esclusivamente le note non identificative della Partita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LottoUpdate"
      responses:
        "200":
          description: Note aggiornate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

  /lotti/{id}/rettifica:
    post:
      operationId: rettificaLotto
      tags: [lotti]
      summary: Registra una rettifica inventariale atomica e auditata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RettificaLottoInput"
      responses:
        "200":
          description: Lot adjusted and movement appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lotto"

