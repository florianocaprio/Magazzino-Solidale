      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterventoSuccessivoInput"
      responses:
        "201":
          description: Intervento successivo creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervento"
        "400":
          description: Dati o collegamento non validi
