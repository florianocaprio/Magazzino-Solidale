    get:
      operationId: searchMensaBeneficiari
      tags: [mensa]
      parameters:
        - {
            name: search,
            in: query,
            required: true,
            schema: { type: string, minLength: 2 },
          }
      responses:
        "200":
          description: Risultati minimali, privi di dati sociali riservati
          content:
            application/json:
              schema:
                {
                  type: array,
                  items:
                    { $ref: "#/components/schemas/MensaBeneficiarioSummary" },
                }

